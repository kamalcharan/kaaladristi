<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kāla-Drishti · Correlation Layer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020917;
  --panel: #0b1221;
  --panel-2: #0d1628;
  --border: #1a2740;
  --border-2: #0f1e35;
  --gold: #c9a84c;
  --gold-dim: #7a6130;
  --text-primary: #e8eaf0;
  --text-mid: #8896aa;
  --text-dim: #4a5568;
  --green: #10b981;
  --red: #ef4444;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --teal: #14b8a6;

  /* State colors */
  --aligned:    #10b981;
  --converging: #c9a84c;
  --watch:      #3b82f6;
  --neutral:    #475569;
  --conflicting:#ef4444;

  /* Style colors */
  --conservative: #3b82f6;
  --balanced:     #c9a84c;
  --aggressive:   #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; padding: 32px 20px 60px;
  gap: 0;
}

/* ── PAGE HEADER ──────────────────────────────────── */
.page-header {
  text-align: center; margin-bottom: 28px;
}
.page-kd {
  font-family: 'Playfair Display', serif;
  font-size: 10px; color: var(--gold);
  letter-spacing: 6px; text-transform: uppercase;
  margin-bottom: 6px;
}
.page-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px; color: var(--text-primary);
  letter-spacing: -0.5px;
}
.page-sub {
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 2px; margin-top: 4px;
}

/* ── SCENARIO + STYLE CONTROLS ───────────────────── */
.controls-wrap {
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column; gap: 10px;
  margin-bottom: 20px;
}
.control-row {
  display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
}
.control-label {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim); font-family: 'DM Mono', monospace;
  text-align: center; margin-bottom: 2px;
}
.sc-btn {
  padding: 5px 12px; border-radius: 16px; cursor: pointer;
  font-size: 10px; letter-spacing: 1px; font-family: 'DM Mono', monospace;
  border: 1px solid var(--border); background: #0f172a;
  color: var(--text-dim); transition: all 0.2s;
}
.sc-btn:hover { color: var(--text-mid); border-color: #2a3a5a; }
.sc-btn.active-scenario { background: #1e293b; color: var(--text-primary); border-color: #334155; }

/* Style buttons */
.style-btn {
  padding: 5px 14px; border-radius: 16px; cursor: pointer;
  font-size: 10px; font-weight: 600; letter-spacing: 1px;
  font-family: 'DM Mono', monospace; border: 1px solid transparent;
  transition: all 0.25s; color: var(--text-dim); background: #0f172a;
}
.style-btn[data-style="Conservative"] { border-color: #1e3a5f; }
.style-btn[data-style="Balanced"]     { border-color: #3a2e10; }
.style-btn[data-style="Aggressive"]   { border-color: #3a1010; }
.style-btn.active-style[data-style="Conservative"] {
  background: rgba(59,130,246,0.12); color: #60a5fa; border-color: #3b82f6; }
.style-btn.active-style[data-style="Balanced"] {
  background: rgba(201,168,76,0.12); color: var(--gold); border-color: var(--gold); }
.style-btn.active-style[data-style="Aggressive"] {
  background: rgba(239,68,68,0.12); color: #f87171; border-color: #ef4444; }

/* ── MAIN CARD ──────────────────────────────────── */
.card {
  width: 100%; max-width: 480px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5);
  transition: border-color 0.5s ease;
}

/* ── VERDICT HERO ───────────────────────────────── */
.verdict-hero {
  padding: 20px 20px 16px;
  position: relative; overflow: hidden;
  border-bottom: 1px solid var(--border-2);
  transition: background 0.5s ease;
}
.verdict-bg {
  position: absolute; inset: 0;
  opacity: 0.04; transition: all 0.5s ease;
}
/* Animated radial pulse */
.verdict-pulse {
  position: absolute; border-radius: 50%;
  pointer-events: none; transition: all 0.5s ease;
}

.verdict-top-row {
  display: flex; align-items: flex-start;
  justify-content: space-between; position: relative;
}
.verdict-left { flex: 1; }
.verdict-eyebrow {
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--text-dim); font-family: 'DM Mono', monospace;
  margin-bottom: 6px;
}
.verdict-state {
  font-family: 'Playfair Display', serif;
  font-size: 28px; font-weight: 900; line-height: 1;
  transition: color 0.4s ease; margin-bottom: 5px;
}
.verdict-tagline {
  font-size: 11px; color: var(--text-mid); line-height: 1.4;
  font-style: italic; max-width: 280px;
  transition: opacity 0.3s ease;
}
.verdict-tagline.fading { opacity: 0.2; }

/* Right side: style indicator */
.verdict-style-indicator {
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  flex-shrink: 0;
}
.style-pill {
  padding: 3px 10px; border-radius: 10px;
  font-size: 8px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; font-family: 'DM Mono', monospace;
  transition: all 0.3s ease;
}
.verdict-date {
  font-family: 'DM Mono', monospace; font-size: 9px;
  color: var(--text-dim);
}

/* ── SCORE BARS ─────────────────────────────────── */
.score-section {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border-2);
}
.score-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}
.score-row:last-child { margin-bottom: 0; }
.score-label {
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-dim); font-family: 'DM Mono', monospace;
  width: 52px; flex-shrink: 0;
}
.score-track {
  flex: 1; height: 5px; background: #0a1020;
  border-radius: 3px; position: relative; overflow: hidden;
}
.score-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.7s cubic-bezier(0.4,0,0.2,1),
              background 0.4s ease;
  position: relative;
}
/* Shimmer on fill */
.score-fill::after {
  content: '';
  position: absolute; top: 0; left: -100%; bottom: 0; width: 60%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  animation: shimmer 2s infinite;
}
@keyframes shimmer { to { left: 200%; } }

.score-value {
  font-family: 'DM Mono', monospace; font-size: 11px;
  width: 32px; text-align: right; flex-shrink: 0;
  transition: color 0.4s ease;
}

/* Gap bar — special */
.gap-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-2); }
.gap-label-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 5px;
}
.gap-label {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim); font-family: 'DM Mono', monospace;
}
.gap-status {
  font-size: 9px; font-family: 'DM Mono', monospace;
  letter-spacing: 1px; transition: color 0.4s ease;
}
.gap-track {
  height: 6px; background: #0a1020; border-radius: 3px;
  position: relative; overflow: visible;
}
.gap-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.7s cubic-bezier(0.4,0,0.2,1),
              background 0.4s ease;
  position: relative;
}
/* Threshold markers */
.gap-threshold {
  position: absolute; top: -3px; bottom: -3px;
  width: 1.5px; border-radius: 1px;
  transition: left 0.4s ease;
}
.threshold-label {
  position: absolute; top: -14px;
  font-size: 7px; color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  transform: translateX(-50%);
  white-space: nowrap;
}

/* ── SIGNAL BREAKDOWN ───────────────────────────── */
.breakdown-section {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-2);
}
.breakdown-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.breakdown-label {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim); font-family: 'DM Mono', monospace;
}
.breakdown-toggle {
  font-size: 8px; color: var(--text-dim); cursor: pointer;
  font-family: 'DM Mono', monospace; letter-spacing: 1px;
  transition: color 0.2s;
}
.breakdown-toggle:hover { color: var(--text-mid); }

.signals-grid {
  display: flex; flex-direction: column; gap: 5px;
}
.signal-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px; border-radius: 6px;
  transition: background 0.3s ease;
}
.signal-row.positive { background: rgba(16,185,129,0.05); }
.signal-row.negative { background: rgba(239,68,68,0.05); }
.signal-row.neutral  { background: transparent; }
.signal-icon {
  font-size: 10px; width: 14px; text-align: center; flex-shrink: 0;
}
.signal-name {
  font-size: 10px; color: var(--text-mid); flex: 1; line-height: 1.3;
}
.signal-weight {
  font-family: 'DM Mono', monospace; font-size: 10px;
  font-weight: 500; flex-shrink: 0;
  transition: color 0.3s ease;
}
.signal-style-note {
  font-size: 8px; color: var(--text-dim);
  font-family: 'DM Mono', monospace; flex-shrink: 0;
  font-style: italic;
}

/* ── LAYER AGREEMENT ────────────────────────────── */
.layers-section {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-2);
}
.layers-label {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim); font-family: 'DM Mono', monospace;
  margin-bottom: 10px;
}
.layers-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
}
.layer-block {
  padding: 8px 10px; border-radius: 8px;
  border: 1px solid transparent;
  display: flex; flex-direction: column; gap: 3px;
  transition: all 0.4s ease;
}
.layer-name {
  font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
  font-family: 'DM Mono', monospace; color: var(--text-dim);
}
.layer-verdict {
  font-size: 10px; font-weight: 600;
  font-family: 'DM Mono', monospace;
  transition: color 0.4s ease;
}
.layer-score {
  font-size: 8px; color: var(--text-dim);
  font-family: 'DM Mono', monospace;
}

/* agreement indicator */
.agreement-row {
  display: flex; align-items: center; gap: 8px; margin-top: 8px;
}
.agreement-dots {
  display: flex; gap: 4px;
}
.agreement-dot {
  width: 8px; height: 8px; border-radius: 50%;
  transition: all 0.4s ease;
}
.agreement-text {
  font-size: 9px; color: var(--text-dim);
  font-family: 'DM Mono', monospace; letter-spacing: 1px;
}

/* ── NARRATIVE SECTION ──────────────────────────── */
.narrative-section {
  padding: 14px 20px 16px;
}
.narrative-label {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim); font-family: 'DM Mono', monospace;
  margin-bottom: 8px;
}
.narrative-text {
  font-size: 12px; color: var(--text-mid);
  line-height: 1.6; font-style: italic;
  transition: opacity 0.3s ease;
  min-height: 56px;
}
.narrative-text.fading { opacity: 0.2; }

/* Style-specific note */
.style-note {
  margin-top: 10px; padding: 8px 12px;
  border-radius: 8px; font-size: 10px;
  font-family: 'DM Mono', monospace; letter-spacing: 0.5px;
  line-height: 1.4; transition: all 0.4s ease;
  display: flex; align-items: flex-start; gap: 8px;
}
.style-note-icon { font-size: 12px; flex-shrink: 0; margin-top: 1px; }

/* ── STYLE COMPARISON MINI ──────────────────────── */
.style-compare {
  padding: 10px 20px 14px;
  background: var(--panel-2);
  border-top: 1px solid var(--border-2);
}
.compare-label {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim); font-family: 'DM Mono', monospace;
  margin-bottom: 8px;
}
.compare-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
}
.compare-block {
  padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--border-2);
  display: flex; flex-direction: column; gap: 2px;
  cursor: pointer; transition: all 0.2s;
}
.compare-block:hover { border-color: #2a3a5a; }
.compare-block.active-compare { border-color: transparent; }
.compare-style-name {
  font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
  font-family: 'DM Mono', monospace;
}
.compare-state {
  font-size: 10px; font-weight: 600;
  font-family: 'DM Mono', monospace;
}
.compare-score {
  font-size: 8px; color: var(--text-dim);
  font-family: 'DM Mono', monospace;
}

/* ── ANIMATIONS ─────────────────────────────────── */
@keyframes pulse-ring {
  0%   { transform: scale(0.8); opacity: 0.6; }
  100% { transform: scale(1.8); opacity: 0; }
}
.pulse-ring {
  position: absolute; border-radius: 50%;
  animation: pulse-ring 2s infinite;
  pointer-events: none;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.animate-in { animation: fadeSlideIn 0.3s ease forwards; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-kd">Kāla-Drishti</div>

<!-- CONTROLS -->

// ═══════════════════════════════════════════════════════

const STYLES = {

// ═══════════════════════════════════════════════════════
// SCENARIOS — real data structure
// ═══════════════════════════════════════════════════════
const SCENARIOS = {
  'Apr 10 · Recovery': {

    astroScore: 7, // Saturn-Mars backdrop + Mercury rising active
    astroDesc: 'Saturn-Mars Conjunction active · Mercury-Mars-Saturn Rise ending Apr 15',

// ═══════════════════════════════════════════════════════
// COMPUTE SCORES
// ═══════════════════════════════════════════════════════
function computeTechScore(signals, style) {
  const W = STYLES[style].weights;
  let score = 0;
  Object.entries(signals).forEach(([key, active]) => {
    if (active && W[key] !== undefined) score += W[key];
  });
  return Math.max(-10, Math.min(10, score));
}

function getCorrelationState(total, style) {
  const T = STYLES[style].thresholds;
  if (total >= T.aligned)    return { state: 'Aligned',    color: '#10b981', tagline: 'All three layers in agreement — highest conviction window' };
  if (total >= T.converging) return { state: 'Converging', color: '#c9a84c', tagline: 'Signals building toward alignment — setup forming, not yet confirmed' };
  if (total <= T.conflicting)return { state: 'Conflicting',color: '#ef4444', tagline: 'Layers in disagreement — elevated risk, stay cautious' };
  if (total > 0)             return { state: 'Watch',      color: '#3b82f6', tagline: 'Positive bias but insufficient confirmation — observe, do not act' };
  return                            { state: 'Neutral',    color: '#475569', tagline: 'No clear edge in either direction — market absent or undecided' };
}

function buildNarrative(scenario, techScore, smScore, style, state) {
  const parts = [];
  const sig = scenario.techSignals;

  // Astro sentence
  if (scenario.astroScore >= 7) parts.push(`Strong astro window active — ${scenario.astroDesc}.`);
  else if (scenario.astroScore >= 4) parts.push(`Moderate astro support — ${scenario.astroDesc}.`);
  else if (scenario.astroScore <= -2) parts.push(`Adverse astro conditions — ${scenario.astroDesc}.`);
  else parts.push(`Quiet astro backdrop — ${scenario.astroDesc}.`);

  // Technical sentence
  if (sig.FRESH_LONGS && sig.SVD_RECENT)
    parts.push('Fresh capital entering with Smart Money fingerprint confirmed.');
  else if (sig.SHORT_COVERING && sig.ACCUMULATION)
    parts.push('Shorts unwinding with institutional accumulation below Golden Line.');
  else if (sig.PUMP_SIGNAL)
    parts.push('⚠ Smart Money exiting while Fast Money holds — distribution risk elevated.');
  else if (sig.FRESH_SHORTS && sig.DISTRIBUTION)
    parts.push('Fresh selling pressure with distribution confirmed above Golden Line.');
  else if (sig.MIXED_FLOW)
    parts.push('No directional conviction in flow intelligence.');

  // RSS sentence
  if (sig.RSS_NEW_HIGH) parts.push('Internal momentum at new high — leads price.');
  else if (sig.SPREAD_REPAIRED) parts.push('Structural spread positive — genuine momentum foundation.');
  else if (sig.SPREAD_NARROWING && scenario.rssSpread < 0)
    parts.push(`Spread narrowing (${scenario.rssSpread.toFixed(0)}) — structure repair in progress.`);

  // Conclusion per style
  if (state.state === 'Aligned') {
    if (style === 'Conservative') parts.push('All confirmation criteria met. Conditions favorable.');
    else if (style === 'Balanced') parts.push('Signals aligned across all three layers.');
    else parts.push('Alignment confirmed. Window open.');
  } else if (state.state === 'Converging') {
    if (style === 'Conservative') parts.push('Awaiting additional confirmation before signalling alignment.');
    else if (style === 'Balanced') parts.push('Setup building. Watch for next signal to confirm.');
    else parts.push('Early alignment forming. Conditions developing.');
  } else if (state.state === 'Conflicting') {
    parts.push('Layers in disagreement. Avoid directional exposure until resolved.');
  } else if (state.state === 'Watch') {
    parts.push('Positive lean but insufficient evidence. Observe next 2-3 bars.');
  } else {
    parts.push('No edge present. Market undecided.');
  }

  return parts.join(' ');
}

function buildSignalRows(signals, style) {
  const W = STYLES[style].weights;
  const rows = [];

  const LABELS = {
    FRESH_LONGS:      'Fresh Capital Entering',
    FRESH_SHORTS:     'Fresh Selling Pressure',
    SHORT_COVERING:   'Shorts Unwinding',
    LONG_LIQUIDATION: 'Long Positions Unwinding',
    ACCUMULATION:     'Institutional Accumulation',
    DISTRIBUTION:     'Distribution Detected',
    RSS_NEW_HIGH:     'RSS New High (leads price)',
    RSS_BULLISH:      'RSS Momentum Bullish',
    SPREAD_REPAIRED:  'Spread Positive (structure)',
    SPREAD_NARROWING: 'Spread Narrowing (recovery)',
    SM_TRENDING:      'Smart Money Trending Up',
    SM_FM_ALIGNED:    'Smart + Fast Money Aligned',
    SVD_RECENT:       'Smart Money Fingerprint (SVD)',
    SBD_RECENT:       'Accumulation Signature (SBD)',
    SYD_PRESENT:      'Distribution Warning (SYD)',
    PUMP_SIGNAL:      'Pump Signal Detected',
    SM_EXITING:       'Smart Money Exiting',
    VOLUME_DIV:       'Volume Divergence Active',
    MIXED_FLOW:       'Mixed Flow — No Bias',
    VACUUM:           'Vacuum Move Detected',
  };

  Object.entries(signals).forEach(([key, active]) => {
    if (!active) return;
    const w = W[key] || 0;
    if (w === 0 && style !== 'Aggressive') return;
    rows.push({
      key, active, weight: w,
      label: LABELS[key] || key,
      positive: w > 0, negative: w < 0, neutral: w === 0,
    });
  });

  // Sort: positive first, then neutral, then negative
  rows.sort((a, b) => b.weight - a.weight);
  return rows;
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
let showBreakdown = true;

function render(scenarioName, style) {
  const sc = SCENARIOS[scenarioName];
  const styleCfg = STYLES[style];
  const techScore = computeTechScore(sc.techSignals, style);
  const total = sc.astroScore + techScore + sc.smScore;
  const corr = getCorrelationState(total, style);
  const T = styleCfg.thresholds;
  const maxPossible = 20; // astro 10 + tech 10 + sm 10

  // ── Verdict Hero ──
  document.getElementById('verdict-hero').style.background =
    `linear-gradient(135deg, ${corr.color}0a 0%, transparent 60%)`;
  document.getElementById('verdict-bg').style.background =
    `radial-gradient(circle at 20% 50%, ${corr.color} 0%, transparent 70%)`;

  const vsEl = document.getElementById('verdict-state');
  vsEl.textContent = corr.state;
  vsEl.style.color = corr.color;

  const tagEl = document.getElementById('verdict-tagline');
  tagEl.classList.add('fading');
  setTimeout(() => {
    tagEl.textContent = corr.tagline;
    tagEl.classList.remove('fading');
  }, 150);

  document.getElementById('card').style.borderColor = corr.color + '44';

  // Style pill
  const sp = document.getElementById('style-pill');
  sp.textContent = style;
  sp.style.cssText = `background:${styleCfg.color}22;color:${styleCfg.color};
    border:1px solid ${styleCfg.color}44;padding:3px 10px;border-radius:10px;
    font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
    font-family:'DM Mono',monospace;`;

  document.getElementById('verdict-date').textContent = sc.date;

  // ── Score Bars ──
  const astroNorm = Math.max(0, (sc.astroScore + 10) / 20);
  const techNorm  = Math.max(0, (techScore + 10) / 20);
  const smNorm    = Math.max(0, (sc.smScore + 10) / 20);

  const astroColor = sc.astroScore >= 6 ? '#10b981'
                   : sc.astroScore >= 3 ? '#c9a84c'
                   : sc.astroScore >= 0 ? '#3b82f6' : '#ef4444';
  const techColor  = techScore >= 5 ? '#10b981'
                   : techScore >= 2 ? '#c9a84c'
                   : techScore >= 0 ? '#3b82f6' : '#ef4444';
  const smColor    = sc.smScore >= 5 ? '#10b981'
                   : sc.smScore >= 2 ? '#c9a84c'
                   : sc.smScore >= 0 ? '#3b82f6' : '#ef4444';

  setBar('astro-fill', astroNorm * 100, astroColor);
  setBar('tech-fill',  techNorm  * 100, techColor);
  setBar('sm-fill',    smNorm    * 100, smColor);

  document.getElementById('astro-score-val').textContent = (sc.astroScore > 0 ? '+' : '') + sc.astroScore;
  document.getElementById('astro-score-val').style.color = astroColor;
  document.getElementById('tech-score-val').textContent  = (techScore > 0 ? '+' : '') + techScore;
  document.getElementById('tech-score-val').style.color  = techColor;
  document.getElementById('sm-score-val').textContent    = (sc.smScore > 0 ? '+' : '') + sc.smScore;
  document.getElementById('sm-score-val').style.color    = smColor;

  // Gap bar
  // Total score range: -30 to +30
  // Map to 0-100% where 50% = zero
  const totalNorm = Math.max(0, Math.min(100, ((total + 30) / 60) * 100));
  const gapColor = corr.state === 'Aligned' ? '#10b981'
                 : corr.state === 'Converging' ? '#c9a84c'
                 : corr.state === 'Conflicting' ? '#ef4444' : '#3b82f6';
  setBar('gap-fill', totalNorm, gapColor);

  // Threshold markers
  const alignedPct  = ((T.aligned + 30) / 60) * 100;
  const convergPct  = ((T.converging + 30) / 60) * 100;
  document.getElementById('aligned-thresh').style.left  = alignedPct  + '%';
  document.getElementById('converging-thresh').style.left = convergPct + '%';
  document.getElementById('aligned-thresh').style.background   = '#10b981';
  document.getElementById('converging-thresh').style.background = '#c9a84c';
  document.getElementById('aligned-thresh-label').style.color   = '#10b981';
  document.getElementById('converging-thresh-label').style.color = '#c9a84c';

  const gapToAligned = Math.max(0, T.aligned - total);
  document.getElementById('gap-status').textContent =
    gapToAligned === 0 ? '✓ Threshold Reached'
    : `${gapToAligned} points to Aligned`;
  document.getElementById('gap-status').style.color =
    gapToAligned === 0 ? '#10b981' : '#c9a84c';

  // ── Signal Breakdown ──
  const signalRows = buildSignalRows(sc.techSignals, style);
  const grid = document.getElementById('signals-grid');
  grid.style.display = showBreakdown ? 'flex' : 'none';
  grid.innerHTML = signalRows.map(r => `
    <div class="signal-row ${r.positive?'positive':r.negative?'negative':'neutral'}">
      <div class="signal-icon">${r.positive ? '✓' : r.negative ? '✗' : '·'}</div>
      <div class="signal-name">${r.label}</div>
      <div class="signal-weight" style="color:${r.positive?'#10b981':r.negative?'#ef4444':'#64748b'}">
        ${r.weight > 0 ? '+' : ''}${r.weight}
      </div>
    </div>
  `).join('') || `<div style="font-size:10px;color:var(--text-dim);font-style:italic;padding:4px 8px">No active signals</div>`;

  document.getElementById('breakdown-toggle').textContent =
    showBreakdown ? 'hide ▲' : 'show ▼';

  // ── Layer Agreement ──
  const layers = sc.layers;
  const layerNames = ['astro', 'flow', 'smart'];
  const layerLabels = { astro: 'Astro', flow: 'Technical', smart: 'Smart $' };
  document.getElementById('layers-grid').innerHTML = layerNames.map(l => `
    <div class="layer-block" style="background:${layers[l].color}0d;border-color:${layers[l].color}33">
      <div class="layer-name">${layerLabels[l]}</div>
      <div class="layer-verdict" style="color:${layers[l].color}">${layers[l].verdict}</div>
      <div class="layer-score" style="color:${layers[l].color}88">
        ${layers[l].score > 0 ? '+' : ''}${layers[l].score}
      </div>
    </div>
  `).join('');

  // Agreement dots
  const agreeing = layerNames.filter(l => layers[l].score > 0).length;
  document.getElementById('agreement-dots').innerHTML =
    layerNames.map(l => `
      <div class="agreement-dot" style="
        background:${layers[l].score > 3 ? layers[l].color : layers[l].score > 0 ? layers[l].color + '66' : '#1e293b'};
        box-shadow:${layers[l].score > 3 ? `0 0 6px ${layers[l].color}` : 'none'};
        border:1px solid ${layers[l].color}44;
      "></div>
    `).join('');

  const agreementText = agreeing === 3 ? 'All three layers aligned'
    : agreeing === 2 ? 'Two of three layers agree'
    : agreeing === 1 ? 'Only one layer positive'
    : 'No layers in agreement';
  document.getElementById('agreement-text').textContent = agreementText;

  // ── Narrative ──
  const narEl = document.getElementById('narrative');
  narEl.classList.add('fading');
  setTimeout(() => {
    narEl.textContent = buildNarrative(sc, techScore, sc.smScore, style, corr);
    narEl.classList.remove('fading');
  }, 150);

  // Style note
  const sn = document.getElementById('style-note');
  sn.style.cssText = `background:${styleCfg.noteColor};border:1px solid ${styleCfg.noteBorder};
    border-radius:8px;padding:8px 12px;display:flex;align-items:flex-start;gap:8px;
    font-size:10px;font-family:'DM Mono',monospace;color:${styleCfg.noteTextColor};
    line-height:1.4;margin-top:10px;`;
  document.getElementById('style-note-icon').textContent = styleCfg.noteIcon;
  document.getElementById('style-note-text').textContent = styleCfg.note;

  // ── Style Comparison ──
  const compareGrid = document.getElementById('compare-grid');
  compareGrid.innerHTML = ['Conservative', 'Balanced', 'Aggressive'].map(s => {
    const sScore = computeTechScore(sc.techSignals, s);
    const sTotal = sc.astroScore + sScore + sc.smScore;
    const sCorr  = getCorrelationState(sTotal, s);
    const sCfg   = STYLES[s];
    const isActive = s === style;
    return `
      <div class="compare-block ${isActive ? 'active-compare' : ''}"
           style="${isActive ? `background:${sCfg.color}12;border-color:${sCfg.color}44;` : ''}"
           onclick="setStyle('${s}')">
        <div class="compare-style-name" style="color:${sCfg.color}">${s}</div>
        <div class="compare-state" style="color:${sCorr.color}">${sCorr.state}</div>
        <div class="compare-score" style="color:${sCfg.color}88">
          ${sTotal > 0 ? '+' : ''}${sTotal} / 30
        </div>
      </div>
    `;
  }).join('');
}

function setBar(id, pct, color) {
  const el = document.getElementById(id);
  el.style.width = Math.max(0, Math.min(100, pct)) + '%';
  el.style.background = `linear-gradient(90deg, ${color}cc, ${color})`;
}

// ═══════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════
let currentScenario = 'Apr 10 · Recovery';
let currentStyle    = 'Balanced';

function setScenario(name) {
  currentScenario = name;
  document.querySelectorAll('.sc-btn').forEach(b =>
    b.classList.toggle('active-scenario', b.dataset.sc === name));
  render(currentScenario, currentStyle);
}

window.setStyle = function(name) {
  currentStyle = name;
  document.querySelectorAll('.style-btn').forEach(b =>
    b.classList.toggle('active-style', b.dataset.style === name));
  render(currentScenario, currentStyle);
};

// Build scenario buttons
const scWrap = document.getElementById('scenario-btns');
Object.keys(SCENARIOS).forEach(name => {
  const btn = document.createElement('button');
  btn.className = `sc-btn${name === currentScenario ? ' active-scenario' : ''}`;
  btn.dataset.sc = name;
  btn.textContent = name;
  btn.onclick = () => setScenario(name);
  scWrap.appendChild(btn);
});

const stWrap = document.getElementById('style-btns');
['Conservative', 'Balanced', 'Aggressive'].forEach(name => {
  const btn = document.createElement('button');
  btn.className = `style-btn${name === currentStyle ? ' active-style' : ''}`;
  btn.dataset.style = name;
  btn.textContent = name;
  btn.onclick = () => setStyle(name);
  stWrap.appendChild(btn);
});

// Breakdown toggle
document.getElementById('breakdown-toggle').onclick = () => {
  showBreakdown = !showBreakdown;
  render(currentScenario, currentStyle);
};

// Init
render(currentScenario, currentStyle);
