<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Scanner Shell</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0b0913; --panel: #141021; --card: #191327; --card-2: #201936;
      --line: rgba(236,231,220,0.12); --ink: #ece7dc; --muted: #a79fb2; --faint: #7d7590;
      --gold: #d8b46a; --gold-ink: #e6c885; --gold-wash: rgba(216,180,106,0.12);
      --green: #6fcf92; --red: #ef8f8f;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; padding: 24px; font-size: 14px; }
    
    .shell-wrap { max-width: 1100px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }

    /* SCANNER SELECTOR TABS */
    .scanner-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .tab { background: var(--card); border: 1px solid var(--line); color: var(--muted); padding: 8px 16px; border-radius: 6px; font-family: var(--mono); font-size: 11px; cursor: pointer; text-transform: uppercase; }
    .tab.active { background: var(--gold-wash); border-color: var(--gold); color: var(--gold-ink); font-weight: bold; }

    /* UNIFIED TABLE */
    .uni-table { width: 100%; border-collapse: collapse; text-align: left; }
    .uni-table th { font-family: var(--mono); font-size: 10px; text-transform: uppercase; color: var(--faint); padding: 10px; border-bottom: 1px solid var(--line); }
    .uni-table td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    
    /* SYMBOL CELL */
    .sym-title { font-family: var(--mono); font-weight: 700; color: #fff; font-size: 1rem; }
    .sym-sub { font-size: 11px; color: var(--faint); }

    /* DYNAMIC MICRO-CELL COMPONENTS */
    .fp-micro { display: flex; align-items: center; gap: 12px; }
    .coil-badge { background: var(--gold-wash); color: var(--gold-ink); border: 1px solid var(--gold); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 10px; }
    .sq-meter { width: 60px; height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
    .sq-fill { height: 100%; background: var(--gold); }

    .lamps { display: flex; gap: 4px; }
    .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 4px rgba(216,180,106,0.6); }
    .lamp.off { background: var(--card-2); box-shadow: none; border: 1px solid var(--line); }

    .up { color: var(--green); } .dn { color: var(--red); }
  </style>
</head>
<body>

<div class="shell-wrap">
  <!-- Top Scanner Switcher -->
  <div class="scanner-tabs">
    <button class="tab active" onclick="switchScanner('flowerpot')">Flower Pot (Squeeze)</button>
    <button class="tab" onclick="switchScanner('confluence')">Strength Confluence</button>
  </div>

  <table class="uni-table">
    <thead>
      <tr>
        <th style="width: 25%;">Symbol & Sector</th>
        <th style="width: 15%;">Last Price</th>
        <!-- DYNAMIC COLUMN HEADER -->
        <th style="width: 40%;" id="dynamicHeader" style="color:var(--gold-ink)">SQUEEZE STATE & METRICS</th>
        <th style="width: 20%; text-align: right;">1D Change</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Rows rendered via JavaScript -->
    </tbody>
  </table>
</div>

<script>
  const data = [
    { 
      symbol: 'SOLARINDS', sector: 'Capital Goods', px: '₹13,482', chg: '+0.4%',
      fp: { status: 'Coiling 11d', tightness: '1.89', fill: '85%' },
      sc: { lamps: [1,1,1,1,1,1], count: '6/6' }
    },
    { 
      symbol: 'RBLBANK', sector: 'Banking', px: '₹381.50', chg: '-0.91%',
      fp: { status: 'Coiling 1d', tightness: '1.36', fill: '40%' },
      sc: { lamps: [1,1,1,1,0,0], count: '4/6' }
    },
    { 
      symbol: 'HOMEFIRST', sector: 'Housing Finance', px: '₹1,179.90', chg: '-0.29%',
      fp: { status: 'Coiling 1d', tightness: '1.31', fill: '35%' },
      sc: { lamps: [1,1,1,1,1,0], count: '5/6' }
    }
  ];

  let currentScanner = 'flowerpot';

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    data.forEach(item => {
      let dynamicCellHtml = '';

      if (currentScanner === 'flowerpot') {
        // Combined Flowerpot Micro-Cell (Replaces 4 raw numeric columns)
        dynamicCellHtml = `
          <div class="fp-micro">
            <span class="coil-badge">🪴 ${item.fp.status}</span>
            <div class="sq-meter"><div class="sq-fill" style="width:${item.fp.fill}"></div></div>
            <span style="font-family:var(--mono); font-size:11px; color:var(--muted)">Tightness: ${item.fp.tightness}</span>
          </div>
        `;
      } else {
        // Combined Confluence Micro-Cell (Replaces 6 individual lamp columns)
        const lampsHtml = item.sc.lamps.map(l => `<span class="lamp ${l ? '' : 'off'}"></span>`).join('');
        dynamicCellHtml = `
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="lamps">${lampsHtml}</div>
            <span style="font-family:var(--mono); font-size:11px; color:var(--gold-ink);">${item.sc.count} Gauges Lit</span>
          </div>
        `;
      }

      const row = `
        <tr>
          <td>
            <div class="sym-title">${item.symbol}</div>
            <div class="sym-sub">${item.sector}</div>
          </td>
          <td style="font-family:var(--mono);">${item.px}</td>
          <td>${dynamicCellHtml}</td>
          <td style="text-align:right; font-family:var(--mono);" class="${item.chg.includes('+') ? 'up' : 'dn'}">${item.chg}</td>
        </tr>
      `;
      tbody.innerHTML += row;
    });
  }

  function switchScanner(type) {
    currentScanner = type;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    if (type === 'flowerpot') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('dynamicHeader').innerText = 'SQUEEZE STATE & METRICS';
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('dynamicHeader').innerText = 'GAUGE AGREEMENT (6 LAMPS)';
    }
    renderTable();
  }

  renderTable();
</script>

</body>
</html>
