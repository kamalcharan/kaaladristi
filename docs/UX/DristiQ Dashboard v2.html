<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DristiQ — Dashboard (v2 · Calm/Standard/Terminal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #07070c;
    --bg-1: #0a0a12;
    --bg-2: #0d0d1a;
    --bg-3: #12121e;
    --bg-4: #16162a;
    --ink-1: #f4ecd6;
    --ink-2: #d9cfb6;
    --ink-3: #8a8372;
    --ink-4: #50493c;
    --ink-5: #2e2a22;
    --gold-1: #e2b96f;
    --gold-2: #c9a84c;
    --gold-3: #8a6f28;
    --gold-glow: rgba(226,185,111,.28);
    --green: #6ecf9a;
    --green-dim: #3a7a5a;
    --red: #d97a6c;
    --red-dim: #7a3a32;
    --indigo: #6d5ce8;
    --indigo-dim: #2d1b69;
    --rule: rgba(226,185,111,.16);
    --rule-soft: rgba(226,185,111,.07);
    --rule-hard: rgba(226,185,111,.3);
    --line: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg-0); color:var(--ink-2); }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .serif { font-family: 'Cormorant Garamond', serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }

  /* Background — cosmic but subtle */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1400px 700px at 85% -10%, rgba(45,27,105,.2), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(226,185,111,.04), transparent 65%);
  }

  /* Layout */
  .app {
    position: relative; z-index: 1;
    max-width: 1680px; margin: 0 auto; padding: 0 24px 60px;
  }

  /* === TYPE === */
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold-2);
  }
  .eyebrow-dim { color: var(--ink-4); }
  .num-display { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* === CARDS === */
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.015), rgba(255,255,255,.003));
    border: 1px solid var(--rule);
    position: relative;
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .card-body { padding: 18px 20px; }
  .card-title { display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-2); }
  .card-title::before { content: "◇"; color: var(--gold-3); }

  /* === BUTTONS === */
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    padding: 7px 12px; font-size: 11px; letter-spacing:.14em; text-transform: uppercase;
    border: 1px solid var(--rule); color: var(--ink-2);
    transition: all .2s ease;
    background: transparent;
  }
  .btn:hover { border-color: var(--gold-2); color: var(--gold-1); background: rgba(226,185,111,.04); }
  .btn.gold { border-color: var(--gold-2); color: var(--gold-1); }
  .btn.gold:hover { background: rgba(226,185,111,.1); box-shadow: 0 0 20px rgba(226,185,111,.15); }
  .btn.active { background: rgba(226,185,111,.1); color: var(--gold-1); border-color: var(--gold-2); }
  .btn.ghost { border: none; padding: 6px 10px; }

  /* === MISC === */
  .hair { height: 1px; background: var(--rule); border: 0; }
  .hair-soft { height: 1px; background: var(--rule-soft); border: 0; }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; }
  .pill {
    display:inline-flex; align-items:center; gap:6px;
    padding: 3px 8px; font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.14em;
    text-transform: uppercase; border: 1px solid var(--rule); color: var(--ink-3);
  }
  .pill.gold { border-color: var(--gold-3); color: var(--gold-1); background: rgba(226,185,111,.05); }
  .pill.green { border-color: var(--green-dim); color: var(--green); background: rgba(110,207,154,.05); }
  .pill.red { border-color: var(--red-dim); color: var(--red); background: rgba(217,122,108,.05); }
  .pill.indigo { border-color: #4a3f8a; color: #a89dff; background: rgba(109,92,232,.08); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(226,185,111,.12); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(226,185,111,.25); }

  /* === Animations === */
  @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
  @keyframes slide-down { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes slowspin { to { transform: rotate(360deg); } }
  .pulse-dot { animation: pulse 2s ease-in-out infinite; }

  /* drawer */
  .drawer {
    max-height: 0; overflow: hidden;
    transition: max-height .45s cubic-bezier(.6,.2,.2,1);
  }
  .drawer.open { max-height: 600px; }

  /* grid */
  .grid { display: grid; }

  /* responsive */
  @media (max-width: 1280px) { .main-grid { grid-template-columns: 260px 1fr !important; } .outlook-col { grid-column: 1 / -1 !important; } }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr !important; } .ambient-grid { grid-template-columns: 1fr 1fr !important; } .rotation-grid { grid-template-columns: 1fr !important; } }

  /* Tooltip */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: rgba(10,10,18,.95); border: 1px solid var(--rule);
    padding: 6px 10px; font-family:'JetBrains Mono',monospace; font-size: 10px; letter-spacing: .08em;
    color: var(--ink-2); white-space: nowrap; z-index: 20; pointer-events: none;
  }
</style>
</head>
<body>

<div class="app" id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react" src="dashboard-data-v2.jsx"></script>
<script type="text/babel" data-presets="env,react" src="dashboard-atoms-v2.jsx"></script>
<script type="text/babel" data-presets="env,react" src="dashboard-panels-v2.jsx"></script>
<script type="text/babel" data-presets="env,react" src="dashboard-app-v2.jsx"></script>

</body>
</html>
