# Phase 1a — guest-token issuer rate limit (6/min per IP, burst 10).
# Keyed on the client address as seen at this hop; meaningful at the edge.
limit_req_zone $binary_remote_addr zone=guest_token:1m rate=6r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to FastAPI backend container
    # Guest-token issuer — rate-limited, otherwise proxied like /api/ (Phase 1a)
    location = /api/guest/token {
        limit_req          zone=guest_token burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://kd-pipeline-api2:8101;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Ops-only probe: never routed through the edge (Phase 1a)
    location ^~ /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass         http://kd-pipeline-api2:8101;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # PostgREST — shared instance
    location /db/ {
        proxy_pass         http://vikuna-postgrest:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
    }
}
