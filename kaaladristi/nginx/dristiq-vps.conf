# DristiQ — vikuna-nginx server block
# Drop this file into /opt/vikuna/docker/docker/config/nginx/conf.d/dristiq.conf
# Then: docker exec vikuna-nginx nginx -s reload

server {
    listen 80;
    server_name dristiq.com;

    # FastAPI v2 — all /api/* calls
    location /api/ {
        proxy_pass         http://kd-pipeline-api2:8101;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # PostgREST — shared instance
    location /db/ {
        proxy_pass         http://vikuna-postgrest:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
    }

    # React SPA
    location / {
        proxy_pass         http://kd-frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
