# Phase 1a — guest-token issuer rate limit (6/min per IP, burst 10).
# Keyed on the client address as seen at this hop; meaningful at the edge.
limit_req_zone $binary_remote_addr zone=guest_token:1m rate=6r/m;

# DristiQ — vikuna-nginx server block
# Drop this file into /opt/vikuna/docker/docker/config/nginx/conf.d/dristiq.conf
# Then: docker exec vikuna-nginx nginx -t && docker exec vikuna-nginx nginx -s reload
# (the edge nginx is shared with other apps — never reload on a failed -t)

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dristiq.com www.dristiq.com;
    return 301 https://dristiq.com$request_uri;
}

# HTTPS — main server block
server {
    listen 443 ssl;
    server_name dristiq.com www.dristiq.com;
    ssl_certificate     /etc/letsencrypt/live/dristiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dristiq.com/privkey.pem;

    # Dynamic upstream resolution. A hostname written literally in proxy_pass
    # is resolved ONCE when nginx loads the config, so a container recreated
    # with a new address on vikuna-net (every `docker compose up -d` of
    # kd-pipeline-api2 or kd-frontend) answers 502 until the SHARED edge nginx
    # is reloaded. Docker's embedded DNS plus a variable in proxy_pass makes
    # nginx re-resolve per request, cached 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api   http://kd-pipeline-api2:8101;
    set $pgrst http://vikuna-postgrest:3000;
    set $web   http://kd-frontend:80;

    # Guest-token issuer — rate-limited, otherwise proxied like /api/ (Phase 1a)
    location = /api/guest/token {
        limit_req          zone=guest_token burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         $api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Ops-only probe: never routed through the edge (Phase 1a)
    location ^~ /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass         $api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /db/ {
        # The old `proxy_pass http://vikuna-postgrest:3000/;` (trailing slash)
        # stripped the /db/ prefix implicitly. A variable proxy_pass passes the
        # request URI untouched, so the strip is explicit here:
        #   /db/km_equity_eod?select=…  →  /km_equity_eod?select=…
        #   /db/rpc/kd_auth_login       →  /rpc/kd_auth_login
        #   /db/                        →  /
        # `break` stops rewrite processing and keeps the request in this
        # location; the query string is carried over unchanged.
        rewrite ^/db/(.*)$ /$1 break;
        proxy_pass         $pgrst;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
    }

    location / {
        proxy_pass         $web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
