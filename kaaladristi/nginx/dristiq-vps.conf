# Phase 1a — guest-token issuer rate limit (6/min per IP, burst 10).
# Keyed on the client address as seen at this hop; meaningful at the edge.
limit_req_zone $binary_remote_addr zone=guest_token:1m rate=6r/m;

# DristiQ — vikuna-nginx server block
# Drop this file into /opt/vikuna/docker/docker/config/nginx/conf.d/dristiq.conf
# Then: docker exec vikuna-nginx nginx -s reload

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dristiq.com www.dristiq.com;
    return 301 https://dristiq.com$request_uri;
}

# HTTPS — main server block
server {
    listen 443 ssl;
    server_name dristiq.com www.dristiq.com;
    ssl_certificate     /etc/letsencrypt/live/dristiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dristiq.com/privkey.pem;

    # Guest-token issuer — rate-limited, otherwise proxied like /api/ (Phase 1a)
    location = /api/guest/token {
        limit_req          zone=guest_token burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://kd-pipeline-api2:8101;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Ops-only probe: never routed through the edge (Phase 1a)
    location ^~ /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass         http://kd-pipeline-api2:8101;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /db/ {
        proxy_pass         http://vikuna-postgrest:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
    }

    location / {
        proxy_pass         http://kd-frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
