# DristiQ — nginx server block for dristiq.com
# Copy this file into the VPS nginx conf.d directory, then reload:
#   docker exec vikuna-nginx nginx -s reload
#
# Assumes:
#   kd-backend  container on internal kd_net, port 8101
#   kd-frontend container on internal kd_net, port 80
#   vikuna-postgrest container on internal kd_net, port 3000

server {
    listen 80;
    server_name dristiq.com;

    # FastAPI backend — all /api/* calls
    location /api/ {
        proxy_pass         http://kd-backend:8101;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # PostgREST — direct DB REST access from frontend
    location /db/ {
        proxy_pass         http://vikuna-postgrest:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
    }

    # React SPA — everything else goes to the frontend container
    location / {
        proxy_pass         http://kd-frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
