server {
    listen 80;
    server_name _;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript;
    gzip_min_length 1024;

    # ── Pipeline v2 API — MUST come before /api/ catch-all ───────────────────
    location /api/pipeline2/ {
        proxy_pass         http://pipeline-api2:8101/api/pipeline2/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # These paths live in pipeline2_api.py (port 8101), not the old API.
    # Must appear before the /api/ catch-all.
    location /api/astro/ {
        proxy_pass         http://pipeline-api2:8101/api/astro/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/panchang/ {
        proxy_pass         http://pipeline-api2:8101/api/panchang/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/ai/ {
        proxy_pass         http://pipeline-api2:8101/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/vani-opportunity/ {
        proxy_pass         http://pipeline-api2:8101/api/vani-opportunity/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Pipeline API  (FastAPI — all /api/* routes) ───────────────────────────
    location /api/ {
        proxy_pass         http://pipeline-api:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # backfill jobs can be slow
    }

    # ── PostgREST  (DB REST layer — /db/* → postgrest:3000/*) ────────────────
    location /db/ {
        proxy_pass         http://postgrest:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
    }

    # ── Frontend SPA (everything else) ───────────────────────────────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;   # client-side routing fallback
    }
}
