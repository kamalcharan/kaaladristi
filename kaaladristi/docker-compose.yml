# DristiQ — product stack
# Joins vikuna-net to reach shared postgres, postgrest, llm-server
# vikuna-nginx handles all HTTP routing via conf.d/dristiq.conf

services:

  # ── Pipeline API v1 — FastAPI + APScheduler (legacy, keep running) ─────────
  pipeline-api:
    build:
      context: ./App/backend
      dockerfile: Dockerfile
    container_name: kd-pipeline-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://kd_app:${KD_APP_PASSWORD}@vikuna-postgres:5432/kaala_dristi_db"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"   # the Qwen server is on the LLM VPS; the old llm-server container is gone (infra doc §2.4). Leave EMPTY and let AI_BASE_URL carry it
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
    volumes:
      - pipeline_data:/app/data
    networks:
      - vikuna-net

  # ── Pipeline API v2 — FastAPI (active, port 8101) ──────────────────────────
  pipeline-api2:
    build:
      context: ./App/backend
      dockerfile: Dockerfile
    container_name: kd-pipeline-api2
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://kd_app:${KD_APP_PASSWORD}@vikuna-postgres:5432/kaala_dristi_db"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"   # the Qwen server is on the LLM VPS; the old llm-server container is gone (infra doc §2.4). Leave EMPTY and let AI_BASE_URL carry it
      # AI layer — values come from the deploy env-file (repo-root .env,
      # passed by deploy.sh via --env-file). Images build from a clean git
      # clone, so a baked-in App/backend/.env never exists in production —
      # every AI setting must be injected here.
      AI_ENABLED: "${AI_ENABLED:-true}"
      AI_PROVIDER: "${AI_PROVIDER:-anthropic}"
      AI_MODEL: "${AI_MODEL:-claude-haiku-4-5}"
      AI_API_KEY: "${AI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Filing reader model: FILING_READ_MODEL, else CLAUDE_MODEL, else the
      # code default (claude-haiku-4-5). Both are passed EMPTY when unset so
      # the fallback order lives in lib/filing_reader.py, not here.
      FILING_READ_MODEL: "${FILING_READ_MODEL:-}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-}"
      FILING_READ_BACKEND: "${FILING_READ_BACKEND:-}"
      FILING_READ_LOCAL_URL: "${FILING_READ_LOCAL_URL:-}"
      FILING_READ_LOCAL_KEY: "${FILING_READ_LOCAL_KEY:-}"
      FILING_READ_LOCAL_CTX: "${FILING_READ_LOCAL_CTX:-}"
      FILING_READ_MAX_PER_PASS: "${FILING_READ_MAX_PER_PASS:-300}"
      FILING_READ_HIGH_DAYS: "${FILING_READ_HIGH_DAYS:-}"
      # LLM lanes (lib/llm_lanes.py): which model serves which priority.
      # Every route left empty means Qwen. Groq / OpenRouter are passed here
      # by name; a third provider needs its four LLM_<NAME>_* lines added too.
      LLM_PROVIDERS: "${LLM_PROVIDERS:-}"
      LLM_ROUTE_HIGH: "${LLM_ROUTE_HIGH:-}"
      LLM_ROUTE_MEDIUM: "${LLM_ROUTE_MEDIUM:-}"
      LLM_ROUTE_LOW: "${LLM_ROUTE_LOW:-}"
      LLM_GROQ_URL: "${LLM_GROQ_URL:-}"
      LLM_GROQ_KEY: "${LLM_GROQ_KEY:-}"
      LLM_GROQ_MODEL: "${LLM_GROQ_MODEL:-}"
      LLM_GROQ_CTX: "${LLM_GROQ_CTX:-}"
      LLM_GROQ_COOLDOWN: "${LLM_GROQ_COOLDOWN:-}"
      LLM_GROQ_MAX_TOKENS: "${LLM_GROQ_MAX_TOKENS:-}"
      LLM_GROQ_JSON: "${LLM_GROQ_JSON:-}"
      LLM_GROQ_REASONING: "${LLM_GROQ_REASONING:-}"
      LLM_OPENROUTER_URL: "${LLM_OPENROUTER_URL:-}"
      LLM_OPENROUTER_KEY: "${LLM_OPENROUTER_KEY:-}"
      LLM_OPENROUTER_MODEL: "${LLM_OPENROUTER_MODEL:-}"
      LLM_OPENROUTER_CTX: "${LLM_OPENROUTER_CTX:-}"
      LLM_OPENROUTER_COOLDOWN: "${LLM_OPENROUTER_COOLDOWN:-}"
      LLM_OPENROUTER_MAX_TOKENS: "${LLM_OPENROUTER_MAX_TOKENS:-}"
      LLM_OPENROUTER_JSON: "${LLM_OPENROUTER_JSON:-}"
      LLM_OPENROUTER_REASONING: "${LLM_OPENROUTER_REASONING:-}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      # Auth for JWT-secured endpoints (/api/framework, /api/correlation, …).
      # Must match PostgREST's PGRST_JWT_SECRET — without it every auth-gated
      # call 500s with 'JWT_SECRET not configured' (Workspace fails to load).
      JWT_SECRET: "${JWT_SECRET:-}"
      # Phase 1a route guards: off | audit | enforce (default audit — log,
      # never block). Flip to enforce after the 24-48h audit window.
      AUTH_MODE: "${AUTH_MODE:-audit}"
      # full = this container runs the worker + scheduler (the VPS). Never api-only here.
      PIPELINE2_ROLE: "${PIPELINE2_ROLE:-full}"
      # CORS allow-list, comma-separated. Production origins by default; add
      # http://localhost:5173 etc. in dev. Tokens travel in headers, so
      # credentials are never allowed.
      CORS_ORIGINS: "${CORS_ORIGINS:-https://dristiq.com,https://www.dristiq.com}"
      # VaNi interaction log + observation cache (separate vani_db instance)
      VANI_DB_URL: "${VANI_DB_URL:-}"
    volumes:
      - pipeline_data:/app/data
      # The nightly integrity check derives the scanner contract from the
      # FRONTEND source (lib/scan_contract.py resolves ../../frontend/src from
      # /app/lib, i.e. /frontend/src). The build context is App/backend, so the
      # image cannot COPY it; mount the checkout read-only instead. Without
      # this, check_scanner_contract raised "scan contract source missing"
      # every night (findings 2026-09-03/04) and the audit never ran in prod.
      - ./App/frontend/src:/frontend/src:ro
    command: ["uvicorn", "pipeline2_api:app", "--host", "0.0.0.0", "--port", "8101", "--workers", "1"]
    networks:
      - vikuna-net

  # ── Frontend — React SPA served by nginx:alpine ────────────────────────────
  kd-frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_POSTGREST_URL:    "/db"
        VITE_PIPELINE_API_URL: ""
        VITE_ANON_KEY:         "${VITE_ANON_KEY:-}"
        GEMINI_API_KEY:        "${GEMINI_API_KEY:-}"
        VITE_RAZORPAY_KEY_ID:  "${VITE_RAZORPAY_KEY_ID:-}"
        # Shared PostHog Cloud project across all Vikuna products — see
        # App/frontend/src/lib/analytics.ts for the product-tagging scheme.
        VITE_POSTHOG_KEY:      "${VITE_POSTHOG_KEY:-}"
        VITE_POSTHOG_HOST:     "${VITE_POSTHOG_HOST:-https://us.i.posthog.com}"
        # Git short SHA stamped into the bundle (deploy.sh exports it) — shown in
        # the sidebar footer so "is the new build live?" is a glance, not a guess.
        VITE_BUILD_SHA:        "${VITE_BUILD_SHA:-}"
    container_name: kd-frontend
    restart: unless-stopped
    networks:
      - vikuna-net

volumes:
  pipeline_data:

networks:
  vikuna-net:
    external: true
    name: vikuna-net
