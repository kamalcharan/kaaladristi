# DristiQ — product stack
# Joins vikuna-net to reach shared postgres, postgrest, llm-server
# vikuna-nginx handles all HTTP routing via conf.d/dristiq.conf

services:

  # ── Pipeline API v1 — FastAPI + APScheduler (legacy, keep running) ─────────
  pipeline-api:
    build:
      context: ./App/backend
      dockerfile: Dockerfile
    container_name: kd-pipeline-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://kd_app:${KD_APP_PASSWORD}@vikuna-postgres:5432/kaala_dristi_db"
      LLM_BASE_URL: "http://llm-server:8080/v1"
    volumes:
      - pipeline_data:/app/data
    networks:
      - vikuna-net

  # ── Pipeline API v2 — FastAPI (active, port 8101) ──────────────────────────
  pipeline-api2:
    build:
      context: ./App/backend
      dockerfile: Dockerfile
    container_name: kd-pipeline-api2
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://kd_app:${KD_APP_PASSWORD}@vikuna-postgres:5432/kaala_dristi_db"
      LLM_BASE_URL: "http://llm-server:8080/v1"
    volumes:
      - pipeline_data:/app/data
    command: ["uvicorn", "pipeline2_api:app", "--host", "0.0.0.0", "--port", "8101", "--workers", "1"]
    networks:
      - vikuna-net

  # ── Frontend — React SPA served by nginx:alpine ────────────────────────────
  kd-frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_POSTGREST_URL:    "/db"
        VITE_PIPELINE_API_URL: ""
        VITE_ANON_KEY:         "${VITE_ANON_KEY:-}"
        GEMINI_API_KEY:        "${GEMINI_API_KEY:-}"
    container_name: kd-frontend
    restart: unless-stopped
    networks:
      - vikuna-net

volumes:
  pipeline_data:

networks:
  vikuna-net:
    external: true
    name: vikuna-net
