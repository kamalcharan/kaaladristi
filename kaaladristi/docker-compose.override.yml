# Local development overrides — auto-merged by docker-compose.
#
# Exposes PostgREST and pipeline-api on host ports so the Vite dev
# server proxy can reach them without going through nginx.
#
# Usage:
#   docker-compose up postgrest pipeline-api   # start only the backend services
#   cd App/frontend && npm run dev             # serve frontend with Vite
#
# Set in App/frontend/.env (or App/.env):
#   POSTGREST_URL=http://localhost:3001
#   VITE_PIPELINE_API_URL=http://localhost:8100

services:

  postgrest:
    ports:
      - "127.0.0.1:3001:3000"   # host:3001 → container:3000

  pipeline-api:
    ports:
      - "127.0.0.1:8100:8100"   # host:8100 → container:8100
